<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E7D32"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#bgGrad3)"/>
  
  <!-- White circular dial surface -->
  <circle cx="64" cy="64" r="42" fill="#FFFFFF"/>
  
  <!-- Golden rice grain motif background inside clock -->
  <circle cx="64" cy="64" r="38" fill="#FFFBEB"/>
  
  <!-- Stopwatch ring / timer rim -->
  <circle cx="64" cy="64" r="34" stroke="#D97706" stroke-width="4" stroke-dasharray="160 50" fill="none" stroke-linecap="round"/>
  
  <!-- Top button -->
  <rect x="58" y="16" width="12" height="8" rx="3" fill="#FFFFFF"/>
  <rect x="62" y="24" width="4" height="4" fill="#FFFFFF"/>
  
  <!-- Stopwatch Hands -->
  <circle cx="64" cy="64" r="4" fill="#D97706"/>
  <line x1="64" y1="64" x2="64" y2="40" stroke="#D97706" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="64" y1="64" x2="80" y2="64" stroke="#2E7D32" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Golden ripe rice ear at bottom -->
  <path d="M46 84 Q54 80 64 82 Q74 80 82 84" stroke="#B45309" stroke-width="2" fill="none"/>
  <ellipse cx="52" cy="80" rx="3" ry="5" transform="rotate(-30 52 80)" fill="#F59E0B"/>
  <ellipse cx="64" cy="78" rx="3" ry="5" fill="#FBBF24"/>
  <ellipse cx="76" cy="80" rx="3" ry="5" transform="rotate(30 76 80)" fill="#F59E0B"/>
</svg>
